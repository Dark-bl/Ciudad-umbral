name: Ciudad Umbral - APK Android (Godot 4.2.2)

on:
  workflow_dispatch:
  push:
    branches: [main, master]

permissions:
  contents: read

jobs:
  build-apk:
    name: Validar y exportar APK Android
    runs-on: ubuntu-22.04
    timeout-minutes: 45

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Instalar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurar Android SDK
        uses: android-actions/setup-android@v3

      - name: Instalar herramientas Android requeridas
        shell: bash
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-$HOME/android-sdk}}"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager --sdk_root="$SDK_ROOT" --install \
            "platform-tools" \
            "platforms;android-33" \
            "build-tools;33.0.2" \
            "cmdline-tools;latest" \
            "cmake;3.10.2.4988404" \
            "ndk;23.2.8568313"

      - name: Instalar Godot 4.2.2
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/godot"
          curl -fL --retry 3 \
            "https://github.com/godotengine/godot/releases/download/4.2.2-stable/Godot_v4.2.2-stable_linux.x86_64.zip" \
            -o "$RUNNER_TEMP/godot.zip"
          unzip -q "$RUNNER_TEMP/godot.zip" -d "$RUNNER_TEMP/godot"
          sudo install -m 0755 \
            "$RUNNER_TEMP/godot/Godot_v4.2.2-stable_linux.x86_64" \
            /usr/local/bin/godot
          godot --headless --version

      - name: Instalar plantillas Android exactas de Godot 4.2.2
        shell: bash
        run: |
          set -euo pipefail
          curl -fL --retry 3 \
            "https://github.com/godotengine/godot/releases/download/4.2.2-stable/Godot_v4.2.2-stable_export_templates.tpz" \
            -o "$RUNNER_TEMP/godot-templates.tpz"
          mkdir -p "$RUNNER_TEMP/godot-templates"
          unzip -q "$RUNNER_TEMP/godot-templates.tpz" -d "$RUNNER_TEMP/godot-templates"
          TEMPLATE_SOURCE="$RUNNER_TEMP/godot-templates/templates"
          test -f "$TEMPLATE_SOURCE/android_debug.apk"
          test -f "$TEMPLATE_SOURCE/android_release.apk"
          TEMPLATE_DEST="$HOME/.local/share/godot/export_templates/4.2.2.stable"
          mkdir -p "$TEMPLATE_DEST"
          cp -a "$TEMPLATE_SOURCE/." "$TEMPLATE_DEST/"
          echo "4.2.2.stable" > "$TEMPLATE_DEST/version.txt"
          ls -lh "$TEMPLATE_DEST/android_debug.apk" "$TEMPLATE_DEST/android_release.apk"

      - name: Crear keystore temporal de depuración
        shell: bash
        run: |
          set -euo pipefail
          keytool -genkeypair -noprompt \
            -keystore "$RUNNER_TEMP/debug.keystore" \
            -deststoretype pkcs12 \
            -storepass android \
            -alias androiddebugkey \
            -keypass android \
            -keyalg RSA \
            -keysize 2048 \
            -validity 9999 \
            -dname "CN=Android Debug,O=Android,C=US"
          {
            echo "GODOT_ANDROID_KEYSTORE_DEBUG_PATH=$RUNNER_TEMP/debug.keystore"
            echo "GODOT_ANDROID_KEYSTORE_DEBUG_USER=androiddebugkey"
            echo "GODOT_ANDROID_KEYSTORE_DEBUG_PASSWORD=android"
          } >> "$GITHUB_ENV"
          mkdir -p "$HOME/.config/godot"
          cat > "$HOME/.config/godot/editor_settings-4.tres" <<EOF_SETTINGS
          [gd_resource type="EditorSettings" format=3]

          [resource]
          export/android/java_sdk_path = "$JAVA_HOME"
          export/android/android_sdk_path = "${ANDROID_HOME:-${ANDROID_SDK_ROOT}}"
          export/android/debug_keystore = "$RUNNER_TEMP/debug.keystore"
          export/android/debug_keystore_user = "androiddebugkey"
          export/android/debug_keystore_pass = "android"
          EOF_SETTINGS

      - name: Validar configuración del proyecto
        shell: bash
        run: |
          set -euo pipefail
          test -f project.godot
          test -f export_presets.cfg
          test -f main.tscn
          grep -q '^name="Android"$' export_presets.cfg
          grep -q '^textures/vram_compression/import_etc2_astc=true$' project.godot
          echo "Proyecto y preset Android encontrados."

      - name: Importar recursos y validar scripts
        shell: bash
        run: |
          set -euo pipefail
          godot --headless --editor --path . --quit --verbose 2>&1 | tee import.log
          if grep -E "Parse Error|SCRIPT ERROR|Parse failed" import.log; then
            echo "Se detectó un error de importación o de GDScript."
            exit 1
          fi

      - name: Ejecutar prueba headless de escena
        shell: bash
        run: |
          set -euo pipefail
          timeout 35s godot --headless --path . --quit-after 180 --verbose 2>&1 | tee runtime.log
          if grep -E "SCRIPT ERROR|Parse Error|Invalid call|Invalid set index" runtime.log; then
            echo "Se detectó un error durante la ejecución de la escena."
            exit 1
          fi

      - name: Exportar APK Android
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build
          godot --headless --verbose --path . --export-debug "Android" build/Ciudad_Umbral.apk 2>&1 | tee export.log
          test -s build/Ciudad_Umbral.apk
          file build/Ciudad_Umbral.apk
          ls -lh build/Ciudad_Umbral.apk

      - name: Publicar APK descargable
        uses: actions/upload-artifact@v4
        with:
          name: Ciudad-Umbral-Android-APK-Debug
          path: build/Ciudad_Umbral.apk
          if-no-files-found: error
          retention-days: 14
